<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Orders | MonRex Artworks</title>
  <style>
    body { background: #0f0f0f; color: #fff; font-family: sans-serif; padding: 20px; }
    h1 { color: #d32f2f; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #181818; }
    th, td { padding: 12px; border: 1px solid #333; text-align: left; }
    th { background: #222; }
  </style>
</head>
<body>
  <h1>MonRex Artworks - Orders Panel</h1>
  <button onclick="loadOrders()" style="background:#d32f2f; color:#fff; border:none; padding:10px 15px; cursor:pointer;">Refresh Orders</button>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Location</th>
        <th>Items</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>

  <script>
    async function loadOrders() {
      const res = await fetch('/api/orders');
      const data = await res.json();
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = data.orders.map(o => `
        <tr>
          <td>${o.createdAt}</td>
          <td>${o.customerName}</td>
          <td>${o.phone}</td>
          <td>${o.town}, ${o.region} (Delivery: GH₵${o.deliveryFee})</td>
          <td>${o.items.map(i => `${i.name} (x${i.quantity})`).join(', ')}</td>
          <td>GH₵ ${o.totalAmount.toFixed(2)}</td>
        </tr>
      `).join('');
    }
    loadOrders();
  </script>
</body>
</html>
