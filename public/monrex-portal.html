<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | MonRex Artworks</title>
  <style>
    :root{--bg:#0f0f0f;--card:#181818;--red:#d32f2f;--text:#fff;--border:#2e2e2e;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
    body{background:var(--bg);color:var(--text);padding:20px;}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:15px;}
    h1 span{color:var(--red);}
    .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .tab-btn{background:var(--card);color:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:0.9rem;}
    .tab-btn.active{background:var(--red);border-color:var(--red);}
    .panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;}
    table{width:100%;border-collapse:collapse;margin-top:15px;}
    th,td{padding:10px;border:1px solid var(--border);text-align:left;font-size:0.85rem;}
    th{background:#222;}
    .fg{margin-bottom:12px;}
    label{display:block;font-size:0.85rem;margin-bottom:4px;color:#aaa;}
    input,select,textarea{width:100%;padding:10px;background:#222;border:1px solid var(--border);color:#fff;border-radius:6px;}
    .btn{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;}
